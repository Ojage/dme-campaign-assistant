<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Campaign Assistant — internal marketing workspace for DME." />
    <meta name="color-scheme" content="light dark" />
    <title>Campaign Assistant · DME Marketing</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong colour scheme. Mirrors src/hooks/useAppTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('campaign-assistant:theme')
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* storage unavailable — fall back to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
