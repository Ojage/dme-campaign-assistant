server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The reverse proxy in front of this container already sets HSTS, nosniff and
  # the rest of the security headers for both public hosts; duplicating them here
  # would only make the two lists drift apart.
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Vite fingerprints everything under /assets/, so a URL always identifies one
  # exact file. Caching it forever is what makes a deploy instant for returning
  # visitors: they fetch index.html, see new hashes, and pull only what changed.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html names those hashes, so it must never be cached — otherwise a
  # deploy keeps serving the previous bundle to everyone who already visited.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: a deep link such as /campaigns/abc resolves to index.html so
  # a refresh or a shared URL lands on the same screen instead of a 404.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
